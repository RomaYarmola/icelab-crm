<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Немає зв'язку | IceLab CRM</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #ffffff;
        color: #001731;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      img { width: 64px; height: 64px; }
      h1 { margin: 0; font-size: 22px; line-height: 1.3; }
      p { margin: 0; font-size: 16px; line-height: 1.5; color: #44546a; }
      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 16px;
        background: #001731;
        color: #ffffff;
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo/mark.svg" alt="IceLab" />
      <h1>Немає зв'язку</h1>
      <p>Перевірте інтернет і спробуйте ще раз. Дані на цій сторінці не зберігаються в телефоні.</p>
      <button type="button" onclick="location.reload()">Спробувати ще раз</button>
    </main>
  </body>
</html>
